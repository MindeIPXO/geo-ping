    const CONFIG = {
      sampleCount: 5,

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function round(value, decimals = 4) {
      const factor = Math.pow(10, decimals);
      return Math.round(value * factor) / factor;
    }

    function continentMatches(value, continent) {
      return String(value || "").split("/").map(v => v.trim()).includes(continent);
    }

    function withCacheBuster(url) {
      const separator = url.includes("?") ? "&" : "?";
      const unique = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      return `${url}${separator}cb=${encodeURIComponent(unique)}`;
    }

    function haversineKm(aLat, aLon, bLat, bLon) {
      const toRad = deg => deg * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(bLat - aLat);
      const dLon = toRad(bLon - aLon);
      const lat1 = toRad(aLat);
      const lat2 = toRad(bLat);
      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function bearingDeg(aLat, aLon, bLat, bLon) {
      const toRad = deg => deg * Math.PI / 180;
      const toDeg = rad => rad * 180 / Math.PI;
      const lat1 = toRad(aLat);
      const lat2 = toRad(bLat);
      const dLon = toRad(bLon - aLon);
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) -
        Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function groupBy(items, keyFn) {
      const map = new Map();
      for (const item of items) {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return map;
    }

    function uniqueById(items) {
      const seen = new Set();
      const result = [];
      for (const item of items) {
        if (!item || !item.id || seen.has(item.id)) continue;
        seen.add(item.id);
        result.push(item);
      }
      return result;
    }

    function mapWithConcurrency(items, concurrency, mapper, onProgress) {
      const results = new Array(items.length);
      let index = 0;
      let completed = 0;

      async function worker() {
        while (index < items.length) {
          const current = index++;
          try {
            results[current] = await mapper(items[current], current);
          } catch (err) {
            results[current] = {
              ok: false,
              error: err.message || String(err),
              item: items[current]
            };
          }
          completed += 1;
          if (onProgress) onProgress(completed, items.length, items[current], results[current]);
        }
      }

      return Promise.all(
        Array.from({ length: Math.min(concurrency, items.length) }, worker)
      ).then(() => results);
    }

    function makeProbeIndex() {
      return new Map(probes.map(probe => [probe.id, probe]));
    }

    async function timeRequest(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), CONFIG.requestTimeoutMs);
      const started = performance.now();

      try {
        await fetch(withCacheBuster(url), {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
          credentials: "omit",
          signal: controller.signal
        });
        return { ok: true, ms: Math.round(performance.now() - started) };
      } catch (err) {
        return {
          ok: false,
          ms: Math.round(performance.now() - started),
          error: err.name || err.message || String(err)
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    function classifyTiming(samplesMs, failedSamples) {
      if (!samplesMs.length) return { suspiciousTiming: true, timingQuality: "failed" };

      const sorted = [...samplesMs].sort((a, b) => a - b);
      const minMs = sorted[0];
      const maxMs = sorted[sorted.length - 1];
      const medianMs = sorted[Math.floor(sorted.length / 2)];
      const rawJitterMs = maxMs - minMs;

      const timeoutLikeOutlier = maxMs >= CONFIG.requestTimeoutMs - 800 && medianMs < 500;
      const veryHighStable = minMs > 1000 && medianMs > 1000 && rawJitterMs < 250;
      const mostlyFailed = failedSamples >= Math.ceil(CONFIG.sampleCount / 2);

      if (mostlyFailed || veryHighStable) {
        return { suspiciousTiming: true, timingQuality: "suspicious" };
      }

      if (timeoutLikeOutlier || rawJitterMs > 1000) {
        return { suspiciousTiming: false, timingQuality: "noisy" };
      }

      return { suspiciousTiming: false, timingQuality: "normal" };
    }

    function summarizeSamples(samplesMs, failedSamples) {
      const sorted = [...samplesMs].sort((a, b) => a - b);
      if (!sorted.length) {
        return {
          ok: false,
          minMs: null,
          maxMs: null,
          medianMs: null,
          jitterMs: null,
          rawJitterMs: null,
          scoreMs: null,
          samplesMs: [],
          failedSamples
        };
      }

      const minMs = sorted[0];
      const maxMs = sorted[sorted.length - 1];
      const medianMs = sorted[Math.floor(sorted.length / 2)];

      // Robust score: ignores the single worst sample for 5-sample runs.
      // This avoids one browser/HTTP timeout turning a good 10 ms endpoint into a 150 ms score.
      const trimmedIndex = Math.max(0, Math.min(sorted.length - 1, Math.ceil(sorted.length * 0.8) - 1));
      const trimmedHighMs = sorted[trimmedIndex];
      const jitterMs = trimmedHighMs - minMs;
      const rawJitterMs = maxMs - minMs;
      const scoreMs = Math.round(minMs + jitterMs * 0.05 + failedSamples * 25);

      return {
        ok: true,
        minMs,
        maxMs,
        medianMs,
        jitterMs,
        rawJitterMs,
        scoreMs,
        samplesMs: sorted,
        failedSamples
      };
    }

    async function measureProbe(probe, stage, sampleCount = CONFIG.sampleCount) {
      const samplesMs = [];
      const errors = [];

      for (let i = 0; i < sampleCount; i++) {
        const result = await timeRequest(probe.url);
        if (result.ok) {
          samplesMs.push(result.ms);
        } else {
          errors.push(result.error);
        }
        if (i < sampleCount - 1) await sleep(CONFIG.sampleDelayMs);
      }

      const summary = summarizeSamples(samplesMs, sampleCount - samplesMs.length);
      const timing = classifyTiming(summary.samplesMs, summary.failedSamples);

      return {
        ...probe,
        ...summary,
        ...timing,
        errors,
        stages: [stage]
      };
    }

    async function measureProbeSet(probesToMeasure, stage, concurrency, onProgress) {
      const unique = uniqueById(probesToMeasure);
      return mapWithConcurrency(
        unique,
        concurrency,
        probe => measureProbe(probe, stage),
        onProgress
      );
    }

    function makeCityKey(probe) {
      return [
        probe.country || "",
        probe.region || "",
        round(Number(probe.lat), 3),
        round(Number(probe.lon), 3)
      ].join("|");
    }

    function makeCityNodes(probesToUse) {
      const byCity = groupBy(
        probesToUse.filter(p =>
          p &&
          Number.isFinite(Number(p.lat)) &&
          Number.isFinite(Number(p.lon)) &&
          p.country &&
          p.region
        ),
        makeCityKey
      );

      const nodes = [];
      for (const [key, cityProbes] of byCity.entries()) {
        const sorted = [...cityProbes].sort((a, b) => {
          // Prefer shorter ids / generic city landmarks as representatives, but keep deterministic.
          return a.id.length - b.id.length || a.id.localeCompare(b.id);
        });
        const representative = sorted[0];

        nodes.push({
          key,
          country: representative.country,
          region: representative.region,
          continent: representative.continent,
          lat: Number(representative.lat),
          lon: Number(representative.lon),
          representative,
          probes: sorted,
          probeCount: sorted.length
        });
      }

      return nodes;
    }

    function centroid(nodes) {
      const valid = nodes.filter(n => Number.isFinite(n.lat) && Number.isFinite(n.lon));
      if (!valid.length) return null;
      return {
        lat: valid.reduce((sum, n) => sum + n.lat, 0) / valid.length,
        lon: valid.reduce((sum, n) => sum + n.lon, 0) / valid.length
      };
    }

    function pickSpreadNodes(nodes, limit) {
      const unique = [...nodes];
      if (unique.length <= limit) return unique;

      const c = centroid(unique);
      const selected = [];

      if (c) {
        let nearestToCenter = unique[0];
        let bestCenterDistance = Infinity;
        for (const node of unique) {
          const d = haversineKm(c.lat, c.lon, node.lat, node.lon);
          if (d < bestCenterDistance) {
            bestCenterDistance = d;
            nearestToCenter = node;
          }
        }
        selected.push(nearestToCenter);
      } else {
        selected.push(unique[0]);
      }

      while (selected.length < limit) {
        let best = null;
        let bestDistance = -1;

        for (const node of unique) {
          if (selected.some(s => s.key === node.key)) continue;

          const nearestSelectedDistance = Math.min(
            ...selected.map(s => haversineKm(node.lat, node.lon, s.lat, s.lon))
          );

          if (nearestSelectedDistance > bestDistance) {
            bestDistance = nearestSelectedDistance;
            best = node;
          }
        }

        if (!best) break;
        selected.push(best);
      }

      return selected;
    }

    function buildGlobalLandmarks() {
      const active = probes.filter(p => p && p.id && p.url && p.continent);
      const byContinent = new Map();

      for (const probe of active) {
        for (const continent of String(probe.continent).split("/").map(v => v.trim()).filter(Boolean)) {
          if (!byContinent.has(continent)) byContinent.set(continent, []);
          byContinent.get(continent).push(probe);
        }
      }

      const landmarks = [];
      for (const [continent, continentProbes] of byContinent.entries()) {
        const nodes = makeCityNodes(continentProbes);
        const spread = pickSpreadNodes(nodes, CONFIG.globalLandmarksPerContinent);
        for (const node of spread) {
          landmarks.push({
            ...node.representative,
            landmarkContinent: continent
          });
        }
      }

      return uniqueById(landmarks);
    }

    function rankGroups(results, groupKey) {
      const successful = results.filter(r => r && r.ok);
      const byGroup = groupBy(successful, groupKey);

      return [...byGroup.entries()]
        .map(([group, groupResults]) => {
          const clean = groupResults.filter(r => !r.suspiciousTiming);
          const rankedSource = clean.length ? clean : groupResults;
          const sorted = [...rankedSource].sort((a, b) => a.scoreMs - b.scoreMs);

          return {
            [groupKey.name || "group"]: group,
            group,
            probeCount: groupResults.length,
            successfulProbes: groupResults.length,
            suspiciousProbes: groupResults.filter(r => r.suspiciousTiming).length,
            noisyProbes: groupResults.filter(r => r.timingQuality === "noisy").length,
            bestProbe: compactResult(sorted[0]),
            bestProbeWasSuspicious: Boolean(sorted[0]?.suspiciousTiming),
            probes: [...groupResults]
              .sort((a, b) => a.scoreMs - b.scoreMs)
              .map(compactResult)
          };
        })
        .sort((a, b) => {
          if (!a.bestProbe && !b.bestProbe) return 0;
          if (!a.bestProbe) return 1;
          if (!b.bestProbe) return -1;
          return a.bestProbe.scoreMs - b.bestProbe.scoreMs;
        });
    }

    function compactResult(r) {
      if (!r) return null;
      return {
        id: r.id,
        country: r.country,
        region: r.region,
        continent: r.continent,
        ok: r.ok,
        minMs: r.minMs,
        maxMs: r.maxMs,
        medianMs: r.medianMs,
        jitterMs: r.jitterMs,
        rawJitterMs: r.rawJitterMs,
        scoreMs: r.scoreMs,
        suspiciousTiming: r.suspiciousTiming,
        timingQuality: r.timingQuality,
        samplesMs: r.samplesMs,
        stages: r.stages
      };
    }

    function nodeForProbeId(nodes, probeId) {
      return nodes.find(node => node.probes.some(p => p.id === probeId));
    }

    function getNodeScore(node, cityResultByKey) {
      const result = cityResultByKey.get(node.key);
      return result?.scoreMs ?? Infinity;
    }

    function pickSpatiallyDiverseCandidates(candidates, limit, minDistanceKm) {
      const sorted = [...candidates].sort((a, b) => a.frontierScore - b.frontierScore);
      const selected = [];

      for (const candidate of sorted) {
        if (selected.length >= limit) break;

        const tooClose = selected.some(existing =>
          haversineKm(candidate.node.lat, candidate.node.lon, existing.node.lat, existing.node.lon) < minDistanceKm
        );

        if (!tooClose) selected.push(candidate);
      }

      for (const candidate of sorted) {
        if (selected.length >= limit) break;
        if (!selected.some(existing => existing.node.key === candidate.node.key)) {
          selected.push(candidate);
        }
      }

      return selected.slice(0, limit).map(c => c.node);
    }

    function selectFrontierCandidates(nodes, measuredKeys, cityResultByKey) {
      const measuredNodes = nodes
        .filter(node => measuredKeys.has(node.key) && cityResultByKey.has(node.key))
        .sort((a, b) => getNodeScore(a, cityResultByKey) - getNodeScore(b, cityResultByKey));

      const anchors = measuredNodes.slice(0, CONFIG.beamSize);
      const unmeasured = nodes.filter(node => !measuredKeys.has(node.key));
      const candidateMap = new Map();

      function addCandidate(node, anchor, kind, extraPenalty = 0) {
        const distanceKm = haversineKm(anchor.lat, anchor.lon, node.lat, node.lon);
        const existing = candidateMap.get(node.key);
        const frontierScore = distanceKm + extraPenalty;

        if (!existing || frontierScore < existing.frontierScore) {
          candidateMap.set(node.key, {
            node,
            anchorKey: anchor.key,
            kind,
            distanceKm,
            frontierScore
          });
        }
      }

      for (const anchor of anchors) {
        const nearest = unmeasured
          .map(node => ({
            node,
            distanceKm: haversineKm(anchor.lat, anchor.lon, node.lat, node.lon)
          }))
          .sort((a, b) => a.distanceKm - b.distanceKm)
          .slice(0, CONFIG.nearestNeighborsPerBeam);

        for (const item of nearest) {
          addCandidate(item.node, anchor, "nearest", 0);
        }

        // Directional sectors prevent the search from getting trapped around one dense city/country.
        const sectorBest = new Map();
        for (const node of unmeasured) {
          const sector = Math.floor(bearingDeg(anchor.lat, anchor.lon, node.lat, node.lon) / 45);
          const distanceKm = haversineKm(anchor.lat, anchor.lon, node.lat, node.lon);
          const previous = sectorBest.get(sector);
          if (!previous || distanceKm < previous.distanceKm) {
            sectorBest.set(sector, { node, distanceKm });
          }
        }

        for (const item of [...sectorBest.values()].slice(0, CONFIG.sectorNeighborsPerBeam)) {
          addCandidate(item.node, anchor, "sector", 100);
        }
      }

      return pickSpatiallyDiverseCandidates(
        [...candidateMap.values()],
        CONFIG.searchBatchSize,
        CONFIG.spatialDiversityKm
      );
    }

    function mergeResultsById(resultSets) {
      const byId = new Map();

      for (const set of resultSets) {
        for (const result of set || []) {
          if (!result || !result.id) continue;

          const existing = byId.get(result.id);
          if (!existing) {
            byId.set(result.id, { ...result, stages: [...(result.stages || [])] });
            continue;
          }

          // Keep the latest measurement but preserve stage history.
          const stages = [...new Set([...(existing.stages || []), ...(result.stages || [])])];
          byId.set(result.id, { ...result, stages });
        }
      }

      return [...byId.values()];
    }

    function updateCityResult(cityResultByKey, node, result) {
      const existing = cityResultByKey.get(node.key);
      if (!existing || (result.ok && result.scoreMs < existing.scoreMs)) {
        cityResultByKey.set(node.key, result);
      }
    }

    async function coordinateGuidedSearch(selectedContinent, selectedContinentResults) {
      const continentProbes = probes.filter(p => continentMatches(p.continent, selectedContinent));
      const cityNodes = makeCityNodes(continentProbes);
      const cityNodeByKey = new Map(cityNodes.map(node => [node.key, node]));

      const measuredKeys = new Set();
      const cityResultByKey = new Map();
      const searchResults = [];
      const waves = [];

      const seedNodes = [];
      for (const result of selectedContinentResults
        .filter(r => r.ok)
        .sort((a, b) => a.scoreMs - b.scoreMs)
        .slice(0, CONFIG.globalSeedCount)) {
        const node = nodeForProbeId(cityNodes, result.id);
        if (node && !seedNodes.some(existing => existing.key === node.key)) {
          seedNodes.push(node);
          measuredKeys.add(node.key);
          updateCityResult(cityResultByKey, node, result);
        }
      }

      // If global landmarks did not map cleanly, fall back to spread seeds.
      if (!seedNodes.length) {
        for (const node of pickSpreadNodes(cityNodes, CONFIG.globalSeedCount)) {
          seedNodes.push(node);
        }
      }

      let bestScore = Infinity;
      let noImprovementWaves = 0;

      for (let wave = 1; wave <= CONFIG.maxSearchWaves; wave++) {
        let candidates;

        if (wave === 1) {
          const frontier = selectFrontierCandidates(cityNodes, measuredKeys, cityResultByKey);
          candidates = uniqueCityNodes([...seedNodes.filter(n => !cityResultByKey.has(n.key)), ...frontier]);
        } else {
          candidates = selectFrontierCandidates(cityNodes, measuredKeys, cityResultByKey);
        }

        candidates = candidates
          .filter(node => !measuredKeys.has(node.key) || !cityResultByKey.has(node.key))
          .slice(0, Math.max(0, CONFIG.maxCityNodesMeasured - measuredKeys.size));

        if (!candidates.length) break;

        const candidateProbes = candidates.map(node => node.representative);
        out.textContent = `Stage 2/5: coordinate-guided ${selectedContinent} search, wave ${wave}: measuring ${candidateProbes.length}; city nodes measured ${measuredKeys.size}/${CONFIG.maxCityNodesMeasured}`;

        const waveResults = await measureProbeSet(
          candidateProbes,
          `coordinate-search-wave-${wave}`,
          CONFIG.searchConcurrency,
          (done, total) => {
            out.textContent = `Stage 2/5: coordinate-guided ${selectedContinent} search, wave ${wave}: measured ${done}/${total}; city nodes measured ${measuredKeys.size}/${CONFIG.maxCityNodesMeasured}`;
          }
        );

        for (let i = 0; i < candidates.length; i++) {
          const node = candidates[i];
          const result = waveResults[i];
          measuredKeys.add(node.key);
          searchResults.push(result);
          if (result && result.ok) updateCityResult(cityResultByKey, node, result);
        }

        const rankedNodes = [...cityResultByKey.entries()]
          .map(([key, result]) => ({ key, result, node: cityNodeByKey.get(key) }))
          .filter(item => item.result && item.result.ok)
          .sort((a, b) => a.result.scoreMs - b.result.scoreMs);

        const waveBest = rankedNodes[0]?.result?.scoreMs ?? Infinity;
        if (waveBest + 1 < bestScore) {
          bestScore = waveBest;
          noImprovementWaves = 0;
        } else {
          noImprovementWaves += 1;
        }

        waves.push({
          wave,
          measuredThisWave: candidates.length,
          totalCityNodesMeasured: measuredKeys.size,
          best: compactResult(rankedNodes[0]?.result),
          topNodes: rankedNodes.slice(0, 8).map(item => ({
            key: item.key,
            country: item.node?.country,
            region: item.node?.region,
            lat: item.node?.lat,
            lon: item.node?.lon,
            result: compactResult(item.result)
          }))
        });

        const goodEnough =
          bestScore <= CONFIG.excellentScoreMs &&
          measuredKeys.size >= CONFIG.minSearchNodesBeforeStop &&
          noImprovementWaves >= 1;

        const stalledEnough =
          measuredKeys.size >= CONFIG.minSearchNodesBeforeStop &&
          noImprovementWaves >= CONFIG.stopAfterNoImprovementWaves;

        if (goodEnough || stalledEnough || measuredKeys.size >= CONFIG.maxCityNodesMeasured) {
          break;
        }
      }

      return {
        selectedContinentTotalProbeCount: continentProbes.length,
        selectedContinentCityNodeCount: cityNodes.length,
        searchResults,
        cityNodes,
        cityResultByKey,
        measuredCityNodeCount: measuredKeys.size,
        waves
      };
    }

    function uniqueCityNodes(nodes) {
      const seen = new Set();
      const result = [];
      for (const node of nodes) {
        if (!node || seen.has(node.key)) continue;
        seen.add(node.key);
        result.push(node);
      }
      return result;
    }

    function buildDetailProbeSet(search, allResults) {
      const cityRank = [...search.cityResultByKey.entries()]
        .map(([key, result]) => ({
          key,
          result,
          node: search.cityNodes.find(n => n.key === key)
        }))
        .filter(item => item.result && item.result.ok && item.node)
        .sort((a, b) => a.result.scoreMs - b.result.scoreMs);

      const topCountries = [];
      for (const item of cityRank) {
        if (!topCountries.includes(item.node.country)) topCountries.push(item.node.country);
        if (topCountries.length >= CONFIG.detailTopCountries) break;
      }

      const detailProbes = [];

      for (const country of topCountries) {
        const countryNodes = search.cityNodes.filter(node => node.country === country);
        const measuredCountryNodes = cityRank.filter(item => item.node.country === country);

        const topRegions = [];
        for (const item of measuredCountryNodes) {
          if (!topRegions.includes(item.node.region)) topRegions.push(item.node.region);
          if (topRegions.length >= CONFIG.detailTopRegionsPerCountry) break;
        }

        const countryProbes = probes.filter(p => p.country === country && continentMatches(p.continent, search.cityNodes[0]?.continent?.split("/")[0] || p.continent));

        if (countryProbes.length <= CONFIG.maxFullCountryProbes) {
          detailProbes.push(...countryProbes);
        } else {
          detailProbes.push(...countryProbes.filter(p => topRegions.includes(p.region)));

          const alreadyRegions = new Set(topRegions);
          const extraNodes = pickSpreadNodes(
            countryNodes.filter(node => !alreadyRegions.has(node.region)),
            Math.max(0, CONFIG.detailTopRegionsPerCountry)
          );

          for (const node of extraNodes) {
            detailProbes.push(node.representative);
          }
        }
      }

      const alreadyMeasuredIds = new Set(allResults.map(r => r.id));
      return uniqueById(detailProbes)
        .filter(probe => !alreadyMeasuredIds.has(probe.id))
        .slice(0, CONFIG.maxDetailProbesTotal);
    }

    async function retestBadButRelevant(results) {
      const ranked = results
        .filter(r => r && r.ok)
        .sort((a, b) => a.scoreMs - b.scoreMs);

      const relevant = ranked.slice(0, 20);
      const toRetest = relevant
        .filter(r => r.timingQuality === "noisy" || r.suspiciousTiming)
        .slice(0, CONFIG.suspiciousRetestMax)
        .map(r => probes.find(p => p.id === r.id))
        .filter(Boolean);

      if (!toRetest.length) return [];

      out.textContent = `Stage 4/5: retesting ${toRetest.length} noisy/suspicious relevant probes at concurrency 1`;

      return measureProbeSet(
        toRetest,
        "retest-relevant-noisy",
        CONFIG.retestConcurrency,
        (done, total) => {
          out.textContent = `Stage 4/5: retesting noisy/suspicious relevant probes: ${done}/${total}`;
        }
      );
    }

    function weightedAverageLocation(results, basedOn) {
      const usable = results.filter(r =>
        r &&
        r.ok &&
        Number.isFinite(r.lat) &&
        Number.isFinite(r.lon) &&
        Number.isFinite(r[basedOn])
      );

      if (!usable.length) return null;

      let totalWeight = 0;
      let latSum = 0;
      let lonSum = 0;

      for (const result of usable) {
        const value = Math.max(1, result[basedOn]);
        const weight = 1 / (value * value);
        totalWeight += weight;
        latSum += Number(result.lat) * weight;
        lonSum += Number(result.lon) * weight;
      }

      return {
        lat: round(latSum / totalWeight, 4),
        lon: round(lonSum / totalWeight, 4)
      };
    }

    function calculateConfidence(closestUsed, finalCountryRanking, selectedCountry, selectedRegion) {
      const clean = closestUsed.filter(r =>
        r.ok &&
        !r.suspiciousTiming &&
        r.timingQuality !== "suspicious"
      );

      if (clean.length < 3) return "low";

      const top5 = clean.slice(0, 5);
      const sameCountryCount = top5.filter(r => r.country === selectedCountry).length;
      const sameRegionCount = top5.filter(r => r.region === selectedRegion).length;

      const bestScore = top5[0]?.scoreMs ?? Infinity;
      const fifthScore = top5[4]?.scoreMs ?? Infinity;
      const spreadMs = fifthScore - bestScore;

      const countryRank = finalCountryRanking.findIndex(r => r.country === selectedCountry);
      const bestCountry = finalCountryRanking[0];
      const secondCountry = finalCountryRanking[1];

      const countryGap =
        bestCountry && secondCountry && bestCountry.bestProbe && secondCountry.bestProbe
          ? secondCountry.bestProbe.scoreMs - bestCountry.bestProbe.scoreMs
          : 0;

      if (
        sameCountryCount >= 5 &&
        sameRegionCount >= 4 &&
        bestScore <= 20 &&
        spreadMs <= 12 &&
        countryRank === 0 &&
        countryGap >= 4
      ) {
        return "very high";
      }

      if (
        sameCountryCount >= 4 &&
        sameRegionCount >= 3 &&
        bestScore <= 30 &&
        spreadMs <= 30 &&
        countryRank === 0
      ) {
        return "high";
      }

      if (
        sameCountryCount >= 3 &&
        bestScore <= 50 &&
        countryRank <= 1
      ) {
        return "medium";
      }

      return "low";
    }

    function estimateFromResults(results, basedOn, finalCountryRanking) {
      const okResults = results.filter(r => r && r.ok && Number.isFinite(r[basedOn]));

      const clean = okResults.filter(r => !r.suspiciousTiming && r.timingQuality !== "suspicious");
      const usable = clean.length >= 3 ? clean : okResults;

      const ranked = [...usable].sort((a, b) => a[basedOn] - b[basedOn]);
      const closestUsed = ranked.slice(0, 5);
      const nearest = closestUsed[0];

      if (!nearest) {
        return {
          ok: false,
          basedOn,
          warning: "No usable probes."
        };
      }

      const approximate = weightedAverageLocation(closestUsed, basedOn);

      return {
        ok: true,
        basedOn,
        warning: "This is network-proximity estimation, not real geolocation.",
        approximateLocation: `${approximate.lat}, ${approximate.lon}`,
        approximateLat: approximate.lat,
        approximateLon: approximate.lon,
        nearestCountry: nearest.country,
        nearestRegion: nearest.region,
        nearestContinent: nearest.continent,
        nearestProbe: nearest.id,
        confidence: calculateConfidence(
          closestUsed,
          finalCountryRanking,
          nearest.country,
          nearest.region
        ),
        excludedSuspiciousCount: okResults.length - clean.length,
        usedSuspiciousFallback: clean.length < 3,
        closestUsed: closestUsed.map(compactResult)
      };
    }

    function countryName(entry) {
      return entry.group;
    }

    function continentName(entry) {
      return entry.group;
    }

    function makeSummary(results) {
      const successful = results.filter(r => r && r.ok);
      const failed = results.filter(r => !r || !r.ok);

      return {
        totalProbes: results.length,
        successfulProbes: successful.length,
        failedProbes: failed.length,
        suspiciousProbes: successful.filter(r => r.suspiciousTiming).length,
        noisyProbes: successful.filter(r => r.timingQuality === "noisy").length,
        bestByPreferredScore: compactResult([...successful].sort((a, b) => a.scoreMs - b.scoreMs)[0]),
        fastestByLowestMeasurement: compactResult([...successful].sort((a, b) => a.minMs - b.minMs)[0])
      };
    }

    runButton.onclick = async () => {
      runButton.disabled = true;

      try {
        const probeIndex = makeProbeIndex();

        out.textContent = "Stage 1/5: measuring global spread landmarks";

        const globalLandmarks = buildGlobalLandmarks();
        const globalResults = await measureProbeSet(
          globalLandmarks,
          "global-spread-landmark",
          CONFIG.globalConcurrency,
          (done, total) => {
            out.textContent = `Stage 1/5: global spread landmarks measured ${done}/${total}`;
          }
        );

        const continentRanking = rankGroups(
          globalResults.map(r => ({
            ...r,
            effectiveContinent: r.landmarkContinent || String(r.continent || "").split("/")[0]
          })),
          function continent(r) { return r.effectiveContinent; }
        );

        const selectedContinent = continentName(continentRanking[0]);
        const selectedContinentResults = globalResults
          .filter(r => r.ok && continentMatches(r.continent, selectedContinent))
          .sort((a, b) => a.scoreMs - b.scoreMs);

        if (!selectedContinent) {
          throw new Error("Could not select continent.");
        }

        const search = await coordinateGuidedSearch(selectedContinent, selectedContinentResults);

        let allMeasuredResults = mergeResultsById([globalResults, search.searchResults]);

        const detailProbeSet = buildDetailProbeSet(search, allMeasuredResults);
        out.textContent = `Stage 3/5: detail expansion for best nearby countries/regions: ${detailProbeSet.length} probes`;

        const detailResults = await measureProbeSet(
          detailProbeSet,
          "best-nearby-detail-expansion",
          CONFIG.detailConcurrency,
          (done, total) => {
            out.textContent = `Stage 3/5: detail expansion measured ${done}/${total}`;
          }
        );

        allMeasuredResults = mergeResultsById([allMeasuredResults, detailResults]);

        const retestResults = await retestBadButRelevant(allMeasuredResults);
        allMeasuredResults = mergeResultsById([allMeasuredResults, retestResults]);

        out.textContent = "Stage 5/5: building estimate";

        const finalCountryRanking = rankGroups(
          allMeasuredResults.filter(r => r.ok && continentMatches(r.continent, selectedContinent)),
          function country(r) { return r.country; }
        );

        const selectedCountry = countryName(finalCountryRanking[0]);
        const finalRegionRanking = rankGroups(
          allMeasuredResults.filter(r => r.ok && r.country === selectedCountry),
          function region(r) { return r.region; }
        );

        const selectedRegion = finalRegionRanking[0]?.group;

        const finalResults = allMeasuredResults
          .filter(r => r.ok && continentMatches(r.continent, selectedContinent))
          .sort((a, b) => a.scoreMs - b.scoreMs);

        const estimate = {
          approximateLocation: estimateFromResults(finalResults, "scoreMs", finalCountryRanking).approximateLocation,
          preferredBasis: "scoreMs = robust min + trimmed-jitter penalty; coordinate-guided nearest-neighbour search; noisy/suspicious timings retested when relevant",
          preferred: estimateFromResults(finalResults, "scoreMs", finalCountryRanking),
          comparison: {
            fromLowestMeasurements: estimateFromResults(finalResults, "minMs", finalCountryRanking),
            fromHighestMeasurements: estimateFromResults(finalResults, "maxMs", finalCountryRanking),
            fromMedianMeasurements: estimateFromResults(finalResults, "medianMs", finalCountryRanking),
            fromPreferredScore: estimateFromResults(finalResults, "scoreMs", finalCountryRanking)
          }
        };

        out.textContent = JSON.stringify({
          estimate,
          narrowing: {
            strategy: "Coordinate-guided nearest-neighbour expansion: global spread landmarks -> choose best continent -> expand from best continent city nodes by nearest graph/sector neighbours -> detail expand only best nearby countries/regions -> retest relevant noisy probes.",
            selectedContinent,
            selectedCountry,
            selectedRegion,
            globalLandmarkProbeCount: globalLandmarks.length,
            selectedContinentTotalProbeCount: search.selectedContinentTotalProbeCount,
            selectedContinentCityNodeCount: search.selectedContinentCityNodeCount,
            coordinateSearchMeasuredCityNodeCount: search.measuredCityNodeCount,
            detailProbeCount: detailProbeSet.length,
            retestProbeCount: retestResults.length,
            measuredProbeCount: allMeasuredResults.length,
            constants: {
              sampleCount: CONFIG.sampleCount,
              globalLandmarksPerContinent: CONFIG.globalLandmarksPerContinent,
              globalSeedCount: CONFIG.globalSeedCount,
              searchBatchSize: CONFIG.searchBatchSize,
              beamSize: CONFIG.beamSize,
              nearestNeighborsPerBeam: CONFIG.nearestNeighborsPerBeam,
              sectorNeighborsPerBeam: CONFIG.sectorNeighborsPerBeam,
              maxSearchWaves: CONFIG.maxSearchWaves,
              maxCityNodesMeasured: CONFIG.maxCityNodesMeasured,
              detailTopCountries: CONFIG.detailTopCountries,
              detailTopRegionsPerCountry: CONFIG.detailTopRegionsPerCountry,
              maxFullCountryProbes: CONFIG.maxFullCountryProbes,
              maxDetailProbesTotal: CONFIG.maxDetailProbesTotal,
              globalConcurrency: CONFIG.globalConcurrency,
              searchConcurrency: CONFIG.searchConcurrency,
              detailConcurrency: CONFIG.detailConcurrency,
              retestConcurrency: CONFIG.retestConcurrency,
              sampleMode: "sequential samples per probe; bounded parallelism across probes"
            },
            continentRanking,
            coordinateSearchWaves: search.waves,
            finalCountryRanking,
            finalRegionRanking
          },
          summary: makeSummary(finalResults),
          measuredSummary: makeSummary(allMeasuredResults),
          results: finalResults.map(compactResult),
          allMeasuredResults: allMeasuredResults
            .sort((a, b) => {
              if (a.ok && b.ok) return a.scoreMs - b.scoreMs;
              if (a.ok) return -1;
              if (b.ok) return 1;
              return 0;
            })
            .map(compactResult)
        }, null, 2);
      } catch (err) {
        out.textContent = JSON.stringify({
          ok: false,
          error: err.stack || err.message || String(err)
        }, null, 2);
      } finally {
        runButton.disabled = false;
      }
    };

  </script>
