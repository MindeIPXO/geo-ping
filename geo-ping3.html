    const SAMPLE_COUNT = 5;

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function appendCacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";
      const nonce = typeof crypto !== "undefined" && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;
      return `${url}${separator}cacheBust=${Date.now()}-${nonce}`;
    }

    async function timeRequest(url, timeoutMs = TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      const start = performance.now();

      try {
        await fetch(appendCacheBust(url), {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
          credentials: "omit",
          signal: controller.signal
        });

        return {
          ok: true,
          ms: performance.now() - start
        };
      } catch (err) {
        return {
          ok: false,
          ms: null,
          error: err.name || String(err)
        };
      } finally {
        clearTimeout(timer);
      }
    }

    async function measureProbe(probe, samples = SAMPLE_COUNT) {
      const errors = [];
      const values = [];

      // Warm-up absorbs DNS/TCP/TLS setup noise. It is not included in samples.
      await timeRequest(probe.url);
      await sleep(WARMUP_GAP_MS);

      // Samples for the same probe stay sequential. Parallelism is only across probes.
      for (let i = 0; i < samples; i++) {
        const result = await timeRequest(probe.url);

        if (result.ok && Number.isFinite(result.ms)) {
          values.push(result.ms);
        } else {
          errors.push(result.error || "failed");
        }

        if (i < samples - 1) {
          await sleep(SAMPLE_GAP_MS);
        }
      }

      values.sort((a, b) => a - b);

      const minMs = values.length ? values[0] : null;
      const maxMs = values.length ? values[values.length - 1] : null;
      const medianMs = values.length ? values[Math.floor(values.length / 2)] : null;
      const jitterMs = minMs === null || maxMs === null ? null : maxMs - minMs;
      const scoreMs = minMs === null || jitterMs === null ? null : minMs + jitterMs * 0.03;

      const result = {
        ...probe,
        ok: values.length > 0,
        minMs: minMs === null ? null : Math.round(minMs),
        maxMs: maxMs === null ? null : Math.round(maxMs),
        medianMs: medianMs === null ? null : Math.round(medianMs),
        jitterMs: jitterMs === null ? null : Math.round(jitterMs),
        scoreMs: scoreMs === null ? null : Math.round(scoreMs),
        samplesMs: values.map(v => Math.round(v)),
        failedSamples: samples - values.length,
        errors
      };

      result.suspiciousTiming = isSuspiciousTiming(result);
      result.timingQuality = getTimingQuality(result);
      return result;
    }

    async function mapWithConcurrency(items, concurrency, mapper, onProgress) {
      const results = new Array(items.length);
      let nextIndex = 0;
      let completed = 0;

      async function worker() {
        while (true) {
          const currentIndex = nextIndex++;
          if (currentIndex >= items.length) {
            return;
          }

          results[currentIndex] = await mapper(items[currentIndex], currentIndex);
          completed += 1;

          if (typeof onProgress === "function") {
            onProgress({ completed, total: items.length, item: items[currentIndex], result: results[currentIndex] });
          }

          if (PROBE_GAP_MS > 0) {
            await sleep(PROBE_GAP_MS);
          }
        }
      }

      const workerCount = Math.max(1, Math.min(concurrency, items.length));
      await Promise.all(Array.from({ length: workerCount }, worker));
      return results;
    }

    async function measureProbeSet(probesToMeasure, stage, concurrency, onProgress) {
      const unique = uniqueById(probesToMeasure);

      return mapWithConcurrency(
        unique,
        concurrency,
        async probe => ({
          ...(await measureProbe(probe, SAMPLE_COUNT)),
          stages: [stage]
        }),
        onProgress
      );
    }

    async function retestSuspiciousResults(results, stage, onProgress) {
      const probeById = buildProbeIndex();
      const suspicious = results
        .filter(result => result.ok && result.suspiciousTiming)
        .sort((a, b) => a.scoreMs - b.scoreMs)
        .slice(0, MAX_SUSPICIOUS_RETESTS_PER_STAGE)
        .map(result => probeById.get(result.id))
        .filter(Boolean);

      if (!suspicious.length) {
        return { results, retested: [] };
      }

      const retested = await measureProbeSet(
        suspicious,
        stage,
        RETEST_CONCURRENCY,
        onProgress
      );

      return {
        results: replaceResultsById(results, retested),
        retested
      };
    }

    function sortByScore(results, options = {}) {
      const preferClean = options.preferClean !== false;

      return [...results].sort((a, b) => {
        const aa = rankingScore(a, preferClean);
        const bb = rankingScore(b, preferClean);
        return aa - bb;
      });
    }

    function rankingScore(result, preferClean = true) {
      if (!result || !result.ok || !Number.isFinite(result.scoreMs)) {
        return Infinity;
      }

      // Keep suspicious timings visible, but make clean timings win when close.
      // This avoids a queued/throttled 1700ms stable result looking authoritative.
      return result.scoreMs + (preferClean && result.suspiciousTiming ? 10000 : 0);
    }

    function uniqueById(items) {
      return [...new Map(items.filter(Boolean).map(item => [item.id, item])).values()];
    }

    function replaceResultsById(originalResults, replacementResults) {
      const byId = new Map(originalResults.map(result => [result.id, result]));

      for (const result of replacementResults) {
        const previous = byId.get(result.id);
        byId.set(result.id, {
          ...result,
          previousMeasurement: previous ? pickSummaryProbe(previous) : null
        });
      }

      return [...byId.values()];
    }

    function continentMatches(probeContinent, selectedContinent) {
      return String(probeContinent)
        .split("/")
        .map(part => part.trim())
        .includes(selectedContinent);
    }

    function countryMatches(probeCountry, selectedCountry) {
      return String(probeCountry).trim() === String(selectedCountry).trim();
    }

    function buildProbeIndex() {
      return new Map(probes.map(probe => [probe.id, probe]));
    }

    function getGlobalLandmarkProbes() {
      const probeById = buildProbeIndex();
      const selected = [];

      for (const ids of Object.values(GLOBAL_LANDMARK_PROBE_IDS)) {
        for (const id of ids.slice(0, GLOBAL_LANDMARKS_PER_CONTINENT)) {
          if (probeById.has(id)) {
            selected.push(probeById.get(id));
          }
        }
      }

      return uniqueById(selected);
    }

    function getContinentProbes(continent) {
      return probes.filter(probe => continentMatches(probe.continent, continent));
    }

    function getCountryProbes(country) {
      return probes.filter(probe => countryMatches(probe.country, country));
    }

    function groupBy(items, getKey) {
      const groups = new Map();

      for (const item of items) {
        const key = getKey(item);
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(item);
      }

      return groups;
    }

    function sampleSpreadByCountry(continentProbes, maxPerCountry) {
      const selected = [];
      const byCountry = groupBy(continentProbes.filter(p => p.country), p => p.country);

      for (const countryProbes of byCountry.values()) {
        selected.push(...pickSpreadProbes(countryProbes, maxPerCountry));
      }

      return uniqueById(selected);
    }

    function pickSpreadProbes(candidateProbes, limit) {
      const unique = uniqueById(candidateProbes)
        .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));

      if (unique.length <= limit) {
        return unique;
      }

      // First prefer a large/popular city if present. This keeps Vilnius in Lithuania,
      // London in the UK, Warsaw in Poland, etc., when such a probe exists.
      const byRegion = groupBy(unique, p => normalizeRegion(p.region));
      const largestRegionGroup = [...byRegion.values()]
        .sort((a, b) => b.length - a.length)[0];

      const selected = [largestRegionGroup[0]];

      // Then choose the farthest probes from already selected probes to cover area.
      while (selected.length < limit) {
        let best = null;
        let bestDistance = -1;

        for (const probe of unique) {
          if (selected.some(item => item.id === probe.id)) {
            continue;
          }

          const nearestSelectedDistance = Math.min(
            ...selected.map(s => haversineKm(probe.lat, probe.lon, s.lat, s.lon))
          );

          // Prefer a new city when distance ties are close.
          const newRegionBonus = selected.some(s => normalizeRegion(s.region) === normalizeRegion(probe.region)) ? 0 : 0.001;
          const score = nearestSelectedDistance + newRegionBonus;

          if (score > bestDistance) {
            bestDistance = score;
            best = probe;
          }
        }

        if (!best) break;
        selected.push(best);
      }

      return selected;
    }

    function normalizeRegion(region) {
      return String(region || "").trim().toLowerCase();
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const radiusKm = 6371;
      const toRad = degrees => degrees * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;
      return 2 * radiusKm * Math.asin(Math.sqrt(a));
    }

    function rankContinents(results) {
      const groups = new Map();

      for (const result of results) {
        for (const continent of String(result.continent).split("/").map(part => part.trim())) {
          if (!groups.has(continent)) {
            groups.set(continent, []);
          }
          groups.get(continent).push(result);
        }
      }

      return [...groups.entries()]
        .map(([continent, continentResults]) => buildRankingEntry("continent", continent, continentResults))
        .sort(compareRankingEntries);
    }

    function rankCountries(results) {
      const groups = new Map();

      for (const result of results) {
        if (!result.country) {
          continue;
        }

        if (!groups.has(result.country)) {
          groups.set(result.country, []);
        }

        groups.get(result.country).push(result);
      }

      return [...groups.entries()]
        .map(([country, countryResults]) => buildRankingEntry("country", country, countryResults))
        .sort(compareRankingEntries);
    }

    function rankCities(results) {
      const groups = new Map();

      for (const result of results) {
        if (!result.region) {
          continue;
        }

        const key = result.region;
        if (!groups.has(key)) {
          groups.set(key, []);
        }

        groups.get(key).push(result);
      }

      return [...groups.entries()]
        .map(([region, regionResults]) => buildRankingEntry("region", region, regionResults))
        .sort(compareRankingEntries);
    }

    function buildRankingEntry(key, value, results) {
      const sorted = sortByScore(results);
      const bestClean = sorted.find(result => result.ok && !result.suspiciousTiming && Number.isFinite(result.scoreMs));
      const bestAny = sorted.find(result => result.ok && Number.isFinite(result.scoreMs));
      const best = bestClean || bestAny;

      return {
        [key]: value,
        probeCount: results.length,
        successfulProbes: results.filter(result => result.ok).length,
        suspiciousProbes: results.filter(result => result.suspiciousTiming).length,
        bestProbe: best ? pickRankingProbe(best) : null,
        bestProbeWasSuspicious: Boolean(best && best.suspiciousTiming),
        probes: sorted.map(pickRankingProbe)
      };
    }

    function pickRankingProbe(result) {
      return {
        id: result.id,
        country: result.country,
        region: result.region,
        continent: result.continent,
        ok: result.ok,
        minMs: result.minMs,
        maxMs: result.maxMs,
        medianMs: result.medianMs,
        jitterMs: result.jitterMs,
        scoreMs: result.scoreMs,
        suspiciousTiming: result.suspiciousTiming,
        timingQuality: result.timingQuality,
        samplesMs: result.samplesMs
      };
    }

    function compareRankingEntries(a, b) {
      const aa = a.bestProbe ? rankingScore(a.bestProbe, true) : Infinity;
      const bb = b.bestProbe ? rankingScore(b.bestProbe, true) : Infinity;
      return aa - bb;
    }

    function getTopCountries(countryRanking, count) {
      return countryRanking
        .filter(entry => entry.bestProbe)
        .slice(0, count)
        .map(entry => entry.country);
    }

    function getCountryDetailProbes(candidateCountries) {
      const countries = new Set(candidateCountries);
      return probes.filter(probe => countries.has(probe.country));
    }

    function getCityRefinementProbes(bestCountry, detailResults, cityCount) {
      if (!bestCountry) {
        return [];
      }

      const bestCountryResults = detailResults.filter(result => countryMatches(result.country, bestCountry));
      const cityRanking = rankCities(bestCountryResults);
      const selectedRegions = new Set(
        cityRanking
          .filter(entry => entry.bestProbe)
          .slice(0, cityCount)
          .map(entry => entry.region)
      );

      return getCountryProbes(bestCountry).filter(probe => selectedRegions.has(probe.region));
    }

    function isSuspiciousTiming(result) {
      if (!result || !result.ok || !Array.isArray(result.samplesMs) || result.samplesMs.length < 3) {
        return false;
      }

      const allSamplesHigh = result.samplesMs.every(ms => ms >= 1000);
      const veryHigh = Number.isFinite(result.minMs) && result.minMs >= 1000;
      const tooStableForHugeDelay = Number.isFinite(result.jitterMs) && result.jitterMs <= 25;
      const timeoutLike = Number.isFinite(result.maxMs) && result.maxMs >= TIMEOUT_MS - 250;

      return (allSamplesHigh && tooStableForHugeDelay) || (veryHigh && tooStableForHugeDelay) || timeoutLike;
    }

    function getTimingQuality(result) {
      if (!result.ok) return "failed";
      if (isSuspiciousTiming(result)) return "suspicious";
      if (Number.isFinite(result.jitterMs) && Number.isFinite(result.minMs) && result.jitterMs > Math.max(100, result.minMs * 2)) {
        return "noisy";
      }
      return "normal";
    }

    function estimateByWeightedCentroid(results, latencyField = "scoreMs") {
      let usable = results
        .filter(r => r.ok && !r.suspiciousTiming && Number.isFinite(r[latencyField]) && Number.isFinite(r.lat) && Number.isFinite(r.lon))
        .sort((a, b) => a[latencyField] - b[latencyField]);

      const excludedSuspiciousCount = results.filter(r => r.suspiciousTiming).length;
      let usedSuspiciousFallback = false;

      if (usable.length < 3) {
        usable = results
          .filter(r => r.ok && Number.isFinite(r[latencyField]) && Number.isFinite(r.lat) && Number.isFinite(r.lon))
          .sort((a, b) => a[latencyField] - b[latencyField]);
        usedSuspiciousFallback = true;
      }

      if (usable.length < 3) {
        return {
          ok: false,
          basedOn: latencyField,
          reason: "Need at least 3 successful probe measurements."
        };
      }

      const closest = usable.slice(0, CLOSEST_PROBES_TO_USE);

      let sumWeight = 0;
      let sumLat = 0;
      let sumLon = 0;

      for (const r of closest) {
        const latency = r[latencyField];
        const weight = 1 / Math.max(1, latency * latency);
        sumWeight += weight;
        sumLat += r.lat * weight;
        sumLon += r.lon * weight;
      }

      const best = usable[0];
      const second = usable[1];
      const lat = +(sumLat / sumWeight).toFixed(4);
      const lon = +(sumLon / sumWeight).toFixed(4);

      return {
        ok: true,
        basedOn: latencyField,
        warning: "This is network-proximity estimation, not real geolocation.",
        approximateLocation: `${lat}, ${lon}`,
        approximateLat: lat,
        approximateLon: lon,
        nearestCountry: best.country,
        nearestRegion: best.region,
        nearestContinent: best.continent,
        nearestProbe: best.id,
        confidence:
          second && second[latencyField] - best[latencyField] > 35 && !usedSuspiciousFallback
            ? "medium"
            : "low",
        excludedSuspiciousCount,
        usedSuspiciousFallback,
        closestUsed: closest.map(pickSummaryProbe)
      };
    }

	function calculateConfidence(closestUsed, finalCountryRanking, selectedCountry, selectedRegion) {
	const clean = closestUsed.filter(r =>
		r.ok &&
		!r.suspiciousTiming &&
		r.timingQuality !== "suspicious"
	);

	if (clean.length < 3) return "low";

	const top5 = clean.slice(0, 5);

	const sameCountryCount = top5.filter(r => r.country === selectedCountry).length;
	const sameRegionCount = top5.filter(r => r.region === selectedRegion).length;

	const bestScore = top5[0]?.scoreMs ?? Infinity;
	const fifthScore = top5[4]?.scoreMs ?? Infinity;
	const spreadMs = fifthScore - bestScore;

	const countryRank = finalCountryRanking.findIndex(r => r.country === selectedCountry);
	const bestCountry = finalCountryRanking[0];
	const secondCountry = finalCountryRanking[1];

	const countryGap =
		bestCountry && secondCountry
		? secondCountry.bestProbe.scoreMs - bestCountry.bestProbe.scoreMs
		: 0;

	if (
		sameCountryCount >= 5 &&
		sameRegionCount >= 4 &&
		bestScore <= 20 &&
		spreadMs <= 10 &&
		countryRank === 0 &&
		countryGap >= 5
	) {
		return "very high";
	}

	if (
		sameCountryCount >= 4 &&
		sameRegionCount >= 3 &&
		bestScore <= 30 &&
		spreadMs <= 25 &&
		countryRank === 0
	) {
		return "high";
	}

	if (
		sameCountryCount >= 3 &&
		bestScore <= 50 &&
		countryRank <= 1
	) {
		return "medium";
	}

	return "low";
	}

    function summarizeResults(results) {
      const successful = results.filter(r => r.ok).length;
      const failed = results.length - successful;
      const sortedByScore = sortByScore(results);
      const sortedByMin = [...results].sort((a, b) => {
        const aa = Number.isFinite(a.minMs) ? a.minMs : Infinity;
        const bb = Number.isFinite(b.minMs) ? b.minMs : Infinity;
        return aa - bb;
      });

      return {
        totalProbes: results.length,
        successfulProbes: successful,
        failedProbes: failed,
        suspiciousProbes: results.filter(r => r.suspiciousTiming).length,
        bestByPreferredScore: sortedByScore[0]?.ok ? pickSummaryProbe(sortedByScore[0]) : null,
        fastestByLowestMeasurement: sortedByMin[0]?.ok ? pickSummaryProbe(sortedByMin[0]) : null,
        noisiestSuccessfulProbes: [...results]
          .filter(r => r.ok && Number.isFinite(r.jitterMs))
          .sort((a, b) => b.jitterMs - a.jitterMs)
          .slice(0, 5)
          .map(pickSummaryProbe),
        suspiciousSuccessfulProbes: [...results]
          .filter(r => r.ok && r.suspiciousTiming)
          .sort((a, b) => a.scoreMs - b.scoreMs)
          .slice(0, 10)
          .map(pickSummaryProbe)
      };
    }

    function pickSummaryProbe(r) {
      return {
        id: r.id,
        country: r.country,
        region: r.region,
        continent: r.continent,
        minMs: r.minMs,
        maxMs: r.maxMs,
        medianMs: r.medianMs,
        jitterMs: r.jitterMs,
        scoreMs: r.scoreMs,
        suspiciousTiming: r.suspiciousTiming,
        timingQuality: r.timingQuality,
        samplesMs: r.samplesMs,
        stages: r.stages
      };
    }

    function renderProgress(stage, completed, total, extra = "") {
      out.textContent = `${stage}: measured ${completed}/${total}${extra}`;
    }

    runButton.onclick = async () => {
      runButton.disabled = true;
      out.textContent = "Stage 1/5: measuring global continent landmarks...";

      try {
        const allStages = [];

        const landmarkProbes = getGlobalLandmarkProbes();
        const landmarkResults = await measureProbeSet(
          landmarkProbes,
          "continent-landmark",
          PROBE_CONCURRENCY,
          ({ completed, total }) => renderProgress("Stage 1/5: measuring global continent landmarks", completed, total)
        );
        allStages.push(...landmarkResults.map(result => ({ ...result, group: "continent-landmark" })));

        const continentRanking = rankContinents(landmarkResults);
        const selectedContinent = continentRanking.find(entry => entry.bestProbe)?.continent;

        if (!selectedContinent) {
          throw new Error("No successful global landmark measurements.");
        }

        const continentProbes = getContinentProbes(selectedContinent);
        const sampledCountryProbes = sampleSpreadByCountry(continentProbes, COUNTRY_SAMPLE_PROBES_PER_COUNTRY);

        out.textContent =
          `Stage 2/5: ${selectedContinent} selected. ` +
          `Measuring up to ${COUNTRY_SAMPLE_PROBES_PER_COUNTRY} spread probes per country ` +
          `(${sampledCountryProbes.length}/${continentProbes.length} probes)...`;

        let countrySampleResults = await measureProbeSet(
          sampledCountryProbes,
          "country-sample-spread",
          PROBE_CONCURRENCY,
          ({ completed, total }) => renderProgress(
            `Stage 2/5: country sampling in ${selectedContinent}`,
            completed,
            total
          )
        );
        allStages.push(...countrySampleResults.map(result => ({ ...result, group: "country-sample-spread" })));

        const countrySampleRetest = await retestSuspiciousResults(
          countrySampleResults,
          "country-sample-suspicious-retest",
          ({ completed, total }) => renderProgress(
            "Stage 2b/5: retesting suspicious sampled probes with concurrency 1",
            completed,
            total
          )
        );
        countrySampleResults = countrySampleRetest.results;
        allStages.push(...countrySampleRetest.retested.map(result => ({ ...result, group: "country-sample-suspicious-retest" })));

        const countrySampleRanking = rankCountries(countrySampleResults);
        const candidateCountries = getTopCountries(countrySampleRanking, TOP_COUNTRIES_TO_EXPAND);

        if (!candidateCountries.length) {
          throw new Error("No successful country sample measurements.");
        }

        const detailProbes = getCountryDetailProbes(candidateCountries);
        out.textContent =
          `Stage 3/5: expanding top ${candidateCountries.length} countries ` +
          `(${candidateCountries.join(", ")}); measuring ${detailProbes.length} probes...`;

        let countryDetailResults = await measureProbeSet(
          detailProbes,
          "top-country-all-probes",
          PROBE_CONCURRENCY,
          ({ completed, total }) => renderProgress(
            `Stage 3/5: expanding countries ${candidateCountries.join(", ")}`,
            completed,
            total
          )
        );
        allStages.push(...countryDetailResults.map(result => ({ ...result, group: "top-country-all-probes" })));

        const countryDetailRetest = await retestSuspiciousResults(
          countryDetailResults,
          "top-country-suspicious-retest",
          ({ completed, total }) => renderProgress(
            "Stage 3b/5: retesting suspicious top-country probes with concurrency 1",
            completed,
            total
          )
        );
        countryDetailResults = countryDetailRetest.results;
        allStages.push(...countryDetailRetest.retested.map(result => ({ ...result, group: "top-country-suspicious-retest" })));

        const countryDetailRanking = rankCountries(countryDetailResults);
        const selectedCountry = countryDetailRanking.find(entry => entry.bestProbe)?.country || candidateCountries[0];

        const cityRefinementProbes = getCityRefinementProbes(selectedCountry, countryDetailResults, TOP_CITIES_TO_REFINE);
        out.textContent =
          `Stage 4/5: refining best country (${selectedCountry}); ` +
          `measuring all probes in top ${TOP_CITIES_TO_REFINE} city/cities (${cityRefinementProbes.length} probes)...`;

        let cityRefinementResults = [];
        if (cityRefinementProbes.length) {
          cityRefinementResults = await measureProbeSet(
            cityRefinementProbes,
            "best-country-top-city-refinement",
            REFINEMENT_CONCURRENCY,
            ({ completed, total }) => renderProgress(
              `Stage 4/5: city refinement in ${selectedCountry}`,
              completed,
              total
            )
          );
          allStages.push(...cityRefinementResults.map(result => ({ ...result, group: "best-country-top-city-refinement" })));
        }

        const cityRetest = await retestSuspiciousResults(
          cityRefinementResults,
          "best-city-suspicious-retest",
          ({ completed, total }) => renderProgress(
            "Stage 4b/5: retesting suspicious city probes with concurrency 1",
            completed,
            total
          )
        );
        cityRefinementResults = cityRetest.results;
        allStages.push(...cityRetest.retested.map(result => ({ ...result, group: "best-city-suspicious-retest" })));

        const finalResults = sortByScore(replaceResultsById(countryDetailResults, cityRefinementResults));
        const finalCountryRanking = rankCountries(finalResults);
        const finalCityRanking = rankCities(finalResults.filter(result => countryMatches(result.country, selectedCountry)));

        const fromLowest = estimateByWeightedCentroid(finalResults, "minMs");
        const fromHighest = estimateByWeightedCentroid(finalResults, "maxMs");
        const fromMedian = estimateByWeightedCentroid(finalResults, "medianMs");
        const fromScore = estimateByWeightedCentroid(finalResults, "scoreMs");

        const allMeasuredResults = sortByScore(allStages, { preferClean: false });

        out.textContent = JSON.stringify({
          estimate: {
            approximateLocation: fromScore.ok ? fromScore.approximateLocation : null,
            preferredBasis: "scoreMs = minMs + jitterMs*0.03; suspicious timings excluded when enough clean probes exist",
            preferred: fromScore,
            comparison: {
              fromLowestMeasurements: fromLowest,
              fromHighestMeasurements: fromHighest,
              fromMedianMeasurements: fromMedian,
              fromPreferredScore: fromScore
            }
          },
          narrowing: {
            strategy:
              "Hierarchical capped expansion: global landmarks -> selected-continent country sampling with up to 3 geographically spread probes per country -> expand top countries -> refine top cities -> retest suspicious high/stable timings at concurrency 1.",
            selectedContinent,
            candidateCountries,
            selectedCountry,
            globalLandmarkProbeCount: landmarkProbes.length,
            selectedContinentTotalProbeCount: continentProbes.length,
            countrySampleProbeCount: sampledCountryProbes.length,
            countryDetailProbeCount: detailProbes.length,
            cityRefinementProbeCount: cityRefinementProbes.length,
            measuredProbeCount: allMeasuredResults.length,
            reusedMeasurements: 0,
            constants: {
              sampleCount: SAMPLE_COUNT,
              globalLandmarksPerContinent: GLOBAL_LANDMARKS_PER_CONTINENT,
              countrySampleProbesPerCountry: COUNTRY_SAMPLE_PROBES_PER_COUNTRY,
              topCountriesToExpand: TOP_COUNTRIES_TO_EXPAND,
              topCitiesToRefine: TOP_CITIES_TO_REFINE,
              probeConcurrency: PROBE_CONCURRENCY,
              refinementConcurrency: REFINEMENT_CONCURRENCY,
              retestConcurrency: RETEST_CONCURRENCY,
              sampleMode: "sequential per probe; bounded parallelism across probes"
            },
            continentRanking,
            countrySampleRanking,
            countryDetailRanking,
            finalCountryRanking,
            finalCityRanking
          },
          summary: summarizeResults(finalResults),
          measuredSummary: summarizeResults(allMeasuredResults),
          results: finalResults,
          sampledCountryResults: sortByScore(countrySampleResults),
          countryDetailResults: sortByScore(countryDetailResults),
          cityRefinementResults: sortByScore(cityRefinementResults),
          allMeasuredResults
        }, null, 2);
      } catch (err) {
        out.textContent = JSON.stringify({
          ok: false,
          error: err.message || String(err)
        }, null, 2);
      } finally {
        runButton.disabled = false;
      }
    };
  </script>
